[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caseflow-agent"
version = "1.0.0"
description = "Enterprise-grade business case competition strategy agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.21",
  "alembic>=1.16",
  "asyncpg>=0.30",
  "fastapi>=0.116",
  "openai-agents>=0.3",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "pypdf>=6.0",
  "python-multipart>=0.0.20",
  "sqlalchemy[asyncio]>=2.0.43",
  "structlog>=25.4",
  "tenacity>=9.1",
  "uvicorn[standard]>=0.35",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "ruff>=0.12",
]

[project.scripts]
caseflow-api = "caseflow.main:main"
caseflow-worker = "caseflow.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/caseflow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
